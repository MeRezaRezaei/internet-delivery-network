services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: idn-laravel-app
    volumes:
      - .:/var/www/html
    # No direct ports - only accessible via haproxy:8081
    environment:
      - APP_ENV=local
      - XRAY_HOST=xray
      - XRAY_PORT=10085
      - XRAY_SECONDARY_HOST=xray_2
      - XRAY_SECONDARY_PORT=10087
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=idn_db
      - DB_USERNAME=idn_user
      - DB_PASSWORD=idn_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PHP_CLI_SERVER_WORKERS=10
      - GRPC_DNS_RESOLVER=native
    depends_on:
      - xray
      - xray_2
      - mysql
      - redis
    networks:
      - idn-network

  failover_daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: idn-failover-daemon
    command: ["php", "artisan", "idn:node:monitor"]
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - XRAY_HOST=xray
      - XRAY_PORT=10085
      - XRAY_SECONDARY_HOST=xray_2
      - XRAY_SECONDARY_PORT=10087
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=idn_db
      - DB_USERNAME=idn_user
      - DB_PASSWORD=idn_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GRPC_DNS_RESOLVER=native
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - idn-network

  xray:
    image: teddysun/xray
    container_name: xray-api-test
    restart: always
    # No direct ports - only accessible via haproxy:10095
    volumes:
      - ./infra/configs/xray/test_api_config.json:/etc/xray/config.json
    networks:
      - idn-network

  xray_2:
    image: teddysun/xray
    container_name: xray-api-test-2
    restart: always
    # No direct ports - only accessible via haproxy:10097
    volumes:
      - ./infra/configs/xray/test_api_config_2.json:/etc/xray/config.json
    networks:
      - idn-network

  xray_dry_run:
    image: teddysun/xray
    container_name: xray-api-dry-run
    restart: always
    # No direct ports - only accessible via haproxy:10099
    volumes:
      - ./infra/configs/xray/test_api_config.json:/etc/xray/config.json
    networks:
      - idn-network

  mysql:
    image: mariadb:10.6
    container_name: idn-mysql
    restart: always
    environment:
      MYSQL_DATABASE: idn_db
      MYSQL_USER: idn_user
      MYSQL_PASSWORD: idn_password
      MYSQL_ROOT_PASSWORD: root_password
    # No direct ports - only accessible via haproxy:3318
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - idn-network

  marzban-mysql:
    image: mariadb:10.6
    container_name: idn-marzban-mysql
    restart: always
    environment:
      MYSQL_DATABASE: marzban
      MYSQL_USER: marzban_user
      MYSQL_PASSWORD: marzban_password
      MYSQL_ROOT_PASSWORD: marzban_root_password
    # No direct ports - only accessible via haproxy:3319
    networks:
      - idn-network

  redis:
    image: redis:alpine
    container_name: idn-redis
    restart: always
    # No direct ports - only accessible via haproxy:6391
    networks:
      - idn-network

  haproxy:
    image: haproxy:alpine
    container_name: idn-haproxy
    restart: always
    volumes:
      - ./infra/configs/haproxy/docker_gateway.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "100.100.4.100:8081:8081"
      - "100.100.4.100:10095:10095"
      - "100.100.4.100:10097:10097"
      - "100.100.4.100:10099:10099"
      - "100.100.4.100:3318:3318"
      - "100.100.4.100:3319:3319"
      - "100.100.4.100:6391:6391"
    networks:
      - idn-network
    depends_on:
      - app
      - xray
      - xray_2
      - mysql
      - marzban-mysql
      - redis

networks:
  idn-network:
    driver: bridge

volumes:
  mysql_data:
